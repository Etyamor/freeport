name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build universal app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.sh --universal

      - name: Confirm the binary is universal
        run: |
          lipo -archs FreePort.app/Contents/MacOS/FreePort
          lipo -archs FreePort.app/Contents/MacOS/FreePort | grep -q arm64
          lipo -archs FreePort.app/Contents/MacOS/FreePort | grep -q x86_64

      - name: Package
        run: |
          # ditto, not zip: it preserves the bundle's code signature.
          ditto -c -k --sequesterRsrc --keepParent FreePort.app FreePort.zip
          shasum -a 256 FreePort.zip | tee FreePort.zip.sha256

      - name: Write release notes
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          1. Download `FreePort.zip` below and unzip it.
          2. Move **FreePort.app** to `/Applications`.
          3. Clear the quarantine flag macOS sets on downloaded apps:

          ```bash
          xattr -dr com.apple.quarantine /Applications/FreePort.app
          ```

          FreePort is ad-hoc signed, not notarized — notarization needs a paid Apple
          Developer account and this is free software. If you would rather not trust a
          downloaded binary, `./build.sh --install` builds it from source in seconds.

          Universal: Apple Silicon and Intel. Requires macOS 13 or later.
          NOTES

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            FreePort.zip FreePort.zip.sha256 \
            --title "FreePort ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            --generate-notes
