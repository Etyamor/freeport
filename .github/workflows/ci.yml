name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build.sh derives the version from tags

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Assemble the app bundle
        run: ./build.sh

      - name: Verify the bundle runs
        run: |
          ./FreePort.app/Contents/MacOS/FreePort --version
          ./FreePort.app/Contents/MacOS/FreePort --list
